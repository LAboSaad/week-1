# .air.toml

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -a -o ./tmp/main ."   # force full rebuild (IMPORTANT)
  bin = "tmp/main"
  full_bin = "tmp/main"

  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]

  delay = 500
  kill_delay = "500ms"

  stop_on_error = true
  send_interrupt = true

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true